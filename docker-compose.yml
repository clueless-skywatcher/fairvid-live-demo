# Broker plus every admissions consumer and the progress manager.
# From the host, Kafka is localhost:9092 and the manager is http://127.0.0.1:5001.
# Inside the Compose network, consumers use kafka:19092.
#
#   docker compose up --build

x-fairvid: &fairvid
  build: .
  image: fairvid:local
  environment:
    FAIRVID_KAFKA_BOOTSTRAP: kafka:19092
    FAIRVID_HOST: 0.0.0.0
    FAIRVID_MANAGER_PORT: "5001"
  volumes:
    - fairvid-state:/app/var
  depends_on:
    kafka:
      condition: service_healthy
  restart: unless-stopped

services:
  kafka:
    image: apache/kafka:3.8.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 25s

  intake:
    <<: *fairvid
    command: ["python", "-m", "fairvid.events.consumers.intake"]

  ocr:
    <<: *fairvid
    command: ["python", "-m", "fairvid.events.consumers.ocr"]

  pages:
    <<: *fairvid
    command: ["python", "-m", "fairvid.events.consumers.pages"]

  summary:
    <<: *fairvid
    command: ["python", "-m", "fairvid.events.consumers.summary"]

  reconcile:
    <<: *fairvid
    command: ["python", "-m", "fairvid.events.consumers.reconcile"]

  eligibility:
    <<: *fairvid
    command: ["python", "-m", "fairvid.events.consumers.eligibility"]

  audio:
    <<: *fairvid
    command: ["python", "-m", "fairvid.events.consumers.audio"]

  transcribe:
    <<: *fairvid
    command: ["python", "-m", "fairvid.events.consumers.transcribe"]

  grade:
    <<: *fairvid
    command: ["python", "-m", "fairvid.events.consumers.grade"]

  prosody:
    <<: *fairvid
    command: ["python", "-m", "fairvid.events.consumers.prosody"]

  behaviour:
    <<: *fairvid
    command: ["python", "-m", "fairvid.events.consumers.behaviour"]

  frame:
    <<: *fairvid
    command: ["python", "-m", "fairvid.events.consumers.frame"]

  evaluate:
    <<: *fairvid
    command: ["python", "-m", "fairvid.events.consumers.evaluate"]

  notify:
    <<: *fairvid
    command: ["python", "-m", "fairvid.events.consumers.notify"]

  manager:
    <<: *fairvid
    command: ["python", "-m", "fairvid.events.manager"]
    ports:
      - "5001:5001"

volumes:
  fairvid-state:
